server:
  port: 8080

spring:
  application:
    name: campus-fit-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
  jwt:
    issuer: campus-fit
    access-token-minutes: ${JWT_ACCESS_MIN:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  file:
    upload-dir: uploads/
  excel:
    import-dir: ../excel # 프로젝트 루트의 excel/ 폴더 (mvn 실행 디렉터리 기준)
