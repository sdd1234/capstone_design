spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campusfit?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: campus_user
    password: campus_pass

  # H2 대안 (필요 시 위 datasource 주석 처리 후 사용)
  # datasource:
  #   url: jdbc:h2:file:./h2data/campusfit;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: campus-fit-dev-only-jwt-secret-key-please-set-JWT_SECRET-env-in-prod-XXXXXXXX
